<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Developer — Agent Workspace</title>
  <style>
    :root {
      --bg: #020713;
      --glass: rgba(10, 20, 44, 0.28);
      --glass-strong: rgba(12, 21, 43, 0.72);
      --line: rgba(153, 181, 255, 0.2);
      --line-strong: rgba(153, 181, 255, 0.32);
      --text: #e8efff;
      --muted: #9db3e3;
      --accent: #7ea0ff;
      --accent-deep: #4668e8;
      --success: #4fd4b5;
      --danger: #ff7272;
      --warn: #f0a05a;
      --code-bg: rgba(6, 12, 28, 0.92);
      --radius: 18px;
      --radius-sm: 12px;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, system-ui, sans-serif;
    }

    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(88px);
    }

    .blob--a {
      width: 48vw;
      height: 48vw;
      top: -14%;
      left: -8%;
      background: radial-gradient(circle, rgba(95, 133, 255, 0.34) 0%, transparent 70%);
      animation: drift-a 16s ease-in-out infinite alternate;
    }

    .blob--b {
      width: 38vw;
      height: 38vw;
      bottom: -8%;
      right: 0;
      background: radial-gradient(circle, rgba(79, 212, 181, 0.2) 0%, transparent 70%);
      animation: drift-b 20s ease-in-out infinite alternate;
    }

    @keyframes drift-a {
      from { transform: translate(0, 0); }
      to { transform: translate(4vw, 3vh); }
    }

    @keyframes drift-b {
      from { transform: translate(0, 0); }
      to { transform: translate(-3vw, -2vh); }
    }

    .app {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      padding: 16px 18px 18px;
    }

    .glass {
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      box-shadow:
        inset 0 1px 0 rgba(153, 181, 255, 0.08),
        0 18px 48px rgba(0, 0, 0, 0.35);
      border-radius: var(--radius);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(145deg, #7ea0ff 0%, #4668e8 80%);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      color: #fff;
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(8, 16, 36, 0.55);
      font-size: 0.78rem;
      color: var(--muted);
    }

    .status-pill strong {
      color: var(--text);
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warn);
      box-shadow: 0 0 0 4px rgba(240, 160, 90, 0.15);
    }

    .dot.connected {
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(79, 212, 181, 0.18);
    }

    .dot.error {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(255, 114, 114, 0.15);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(300px, 1.05fr) minmax(320px, 0.95fr);
      gap: 14px;
      min-height: 0;
      overflow: hidden;
    }

    .panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 16, 36, 0.35);
    }

    .panel-head h2 {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .panel-head span {
      display: block;
      margin-top: 2px;
      font-size: 0.74rem;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-sm {
      border: 1px solid var(--line);
      background: rgba(8, 16, 36, 0.65);
      color: var(--text);
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }

    .btn-sm:hover:not(:disabled) {
      background: rgba(126, 160, 255, 0.14);
      border-color: var(--line-strong);
      transform: translateY(-1px);
    }

    .btn-sm:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-sm.primary {
      background: linear-gradient(135deg, rgba(126, 160, 255, 0.95), rgba(70, 104, 232, 0.95));
      border-color: transparent;
      color: #fff;
    }

    .btn-sm.danger {
      border-color: rgba(255, 114, 114, 0.45);
      color: #ffc9c9;
      background: rgba(255, 114, 114, 0.12);
    }

    .chat-log {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 94%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--glass-strong);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .message.user {
      margin-left: auto;
      border-color: rgba(126, 160, 255, 0.35);
      background: rgba(70, 104, 232, 0.22);
    }

    .message.agent {
      margin-right: auto;
    }

    .message.file-op {
      margin-right: auto;
      max-width: 100%;
      padding: 8px 11px;
      border-color: rgba(79, 212, 181, 0.35);
      background: rgba(79, 212, 181, 0.1);
    }

    .message.file-op .message-meta { color: #86efd4; }

    .message.file-op .message-body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
    }

    .message-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .message-body {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .chat-loader {
      display: none;
      align-items: center;
      gap: 8px;
      margin: 4px 14px 0;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px dashed var(--line);
      color: var(--muted);
      font-size: 0.78rem;
    }

    .chat-loader.visible { display: inline-flex; }

    .chat-loader .spinner {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(153, 181, 255, 0.25);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .composer {
      border-top: 1px solid var(--line);
      padding: 12px 14px 14px;
      background: rgba(8, 16, 36, 0.35);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
    }

    textarea {
      width: 100%;
      min-height: 88px;
      max-height: 160px;
      resize: vertical;
      padding: 11px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: rgba(6, 12, 28, 0.88);
      color: var(--text);
      font: inherit;
      font-size: 0.88rem;
      line-height: 1.5;
      outline: none;
    }

    textarea:focus {
      border-color: rgba(126, 160, 255, 0.55);
      box-shadow: 0 0 0 3px rgba(126, 160, 255, 0.14);
    }

    .composer-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .files-column {
      display: grid;
      grid-template-rows: minmax(0, 0.42fr) minmax(0, 0.58fr);
      gap: 14px;
      min-height: 0;
    }

    .file-list {
      list-style: none;
      margin: 0;
      padding: 10px 12px 12px;
      overflow: auto;
      min-height: 0;
      display: grid;
      gap: 7px;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: rgba(8, 16, 36, 0.55);
      cursor: pointer;
      transition: border-color 0.12s ease, background 0.12s ease;
    }

    .file-item:hover {
      border-color: var(--line-strong);
      background: rgba(126, 160, 255, 0.1);
    }

    .file-item.active {
      border-color: rgba(126, 160, 255, 0.5);
      background: rgba(126, 160, 255, 0.16);
    }

    .file-path {
      font-size: 0.82rem;
      word-break: break-all;
    }

    .file-meta {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .preview-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 10px 12px 12px;
    }

    pre {
      margin: 0;
      padding: 14px;
      border-radius: var(--radius-sm);
      background: var(--code-bg);
      border: 1px solid var(--line);
      color: #dbe7ff;
      font-size: 0.8rem;
      line-height: 1.5;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
    }

    .empty-state {
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: var(--radius-sm);
      padding: 18px;
      text-align: center;
      font-size: 0.84rem;
      line-height: 1.55;
    }

    @media (max-width: 1024px) {
      html, body { overflow: auto; }
      .app { height: auto; min-height: 100vh; overflow: visible; }
      .workspace {
        grid-template-columns: 1fr;
        height: auto;
        overflow: visible;
      }
      .files-column {
        grid-template-rows: auto minmax(280px, 1fr);
      }
      .panel { min-height: 360px; }
    }

    @media (max-width: 640px) {
      .app { padding: 12px; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .status-group { width: 100%; justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="blob blob--a"></div>
    <div class="blob blob--b"></div>
  </div>

  <div class="app">
    <header class="topbar glass">
      <div class="brand">
        <div class="brand-mark">AD</div>
        <div>
          <h1 id="projectTitle">AI Developer Workspace</h1>
          <p id="projectSubtitle">Code generation session</p>
        </div>
      </div>
      <div class="status-group">
        <div class="status-pill">
          <span id="connDot" class="dot"></span>
          <span id="connText">Disconnected</span>
        </div>
        <div class="status-pill">Files <strong id="fileCount">0</strong></div>
      </div>
    </header>

    <main class="workspace">
      <section class="panel glass chat-panel">
        <div class="panel-head">
          <div>
            <h2>Agent Chat</h2>
            <span>Prompts and generation updates</span>
          </div>
          <div class="toolbar">
            <button type="button" class="btn-sm" id="connectBtn" title="Connect WebSocket">Connect</button>
            <button type="button" class="btn-sm" id="clearBtn" title="Clear chat">Clear</button>
            <button type="button" class="btn-sm danger" id="stopBtn" disabled title="Stop generation">Stop</button>
          </div>
        </div>

        <div id="chatLog" class="chat-log"></div>
        <div id="chatLoader" class="chat-loader" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <span>Agent is generating…</span>
        </div>

        <div class="composer">
          <textarea id="promptInput" placeholder="Describe what to build or refine…"></textarea>
          <div class="composer-actions">
            <button type="button" class="btn-sm primary" id="sendBtn">Send</button>
          </div>
        </div>
      </section>

      <div class="files-column">
        <section class="panel glass files-panel">
          <div class="panel-head">
            <div>
              <h2>Project Files</h2>
              <span>Generated in this session</span>
            </div>
            <button type="button" class="btn-sm" id="refreshBtn" title="Refresh file list">Refresh</button>
          </div>
          <ul id="fileList" class="file-list"></ul>
        </section>

        <section class="panel glass preview-panel">
          <div class="panel-head">
            <div>
              <h2>Preview</h2>
              <span id="previewLabel">Select a file</span>
            </div>
            <button type="button" class="btn-sm" id="copyBtn" title="Copy file contents">Copy</button>
          </div>
          <div class="preview-body">
            <pre id="previewBox">No file selected.</pre>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('projectId') || '';
    const sessionFromUrl = urlParams.get('session') || '';

    const CONFIG = {
      wsUrl: urlParams.get('ws') || 'ws://localhost:8001/ws/chat',
      sessionId: sessionFromUrl || `session-${Date.now()}`,
      autostart: urlParams.get('autostart') === '1',
      projectName: urlParams.get('projectName') || '',
      projectId,
    };

    const launchConfig = {
      autostart: CONFIG.autostart,
      prompt: '',
      projectName: CONFIG.projectName,
      projectId,
      workingDirectory: '',
      pendingAutostart: false,
      bootstrapStatus: 'loading',
    };

    function apiBaseFromWs(wsUrl) {
      const normalized = (wsUrl || CONFIG.wsUrl).replace(/^wss:/, 'https:').replace(/^ws:/, 'http:');
      try {
        const parsed = new URL(normalized);
        return `${parsed.protocol}//${parsed.host}`;
      } catch (_) {
        return 'http://localhost:8001';
      }
    }

    function logDebug(message) {
      console.log('[agent-ui]', message);
    }

    async function loadSessionBootstrap() {
      const session = CONFIG.sessionId;
      const apiBase = apiBaseFromWs(CONFIG.wsUrl);
      if (!sessionFromUrl) {
        launchConfig.bootstrapStatus = 'no-session';
        logDebug('No session id in URL — autostart disabled.');
        return;
      }
      try {
        const response = await fetch(`${apiBase}/api/session/${encodeURIComponent(session)}`);
        if (!response.ok) {
          launchConfig.bootstrapStatus = 'miss';
          logDebug(`bootstrap MISS for ${session} (HTTP ${response.status})`);
          return;
        }
        const data = await response.json();
        launchConfig.bootstrapStatus = 'ok';
        launchConfig.prompt = data.prompt || '';
        launchConfig.workingDirectory = data.working_directory || data.workingDirectory || '';
        if (data.project_name) {
          launchConfig.projectName = data.project_name;
        }
        if (launchConfig.prompt) {
          els.promptInput.value = launchConfig.prompt;
        }
        launchConfig.pendingAutostart = launchConfig.autostart && Boolean(launchConfig.prompt);
        logDebug(`bootstrap OK | prompt_chars=${data.prompt_chars || launchConfig.prompt.length}`);
        if (launchConfig.workingDirectory) {
          addMessage('agent', `Working in ${launchConfig.workingDirectory}`, 'system');
        }
      } catch (error) {
        launchConfig.bootstrapStatus = 'error';
        logDebug(`bootstrap ERROR — ${error}`);
      }
    }

    const state = {
      socket: null,
      connected: false,
      sessionId: CONFIG.sessionId,
      messages: [],
      files: [],
      selectedFileIndex: -1,
      rawOutput: '',
      generating: false,
    };

    const els = {
      connDot: document.getElementById('connDot'),
      connText: document.getElementById('connText'),
      fileCount: document.getElementById('fileCount'),
      chatLog: document.getElementById('chatLog'),
      chatLoader: document.getElementById('chatLoader'),
      promptInput: document.getElementById('promptInput'),
      connectBtn: document.getElementById('connectBtn'),
      clearBtn: document.getElementById('clearBtn'),
      sendBtn: document.getElementById('sendBtn'),
      stopBtn: document.getElementById('stopBtn'),
      refreshBtn: document.getElementById('refreshBtn'),
      fileList: document.getElementById('fileList'),
      previewBox: document.getElementById('previewBox'),
      previewLabel: document.getElementById('previewLabel'),
      copyBtn: document.getElementById('copyBtn'),
      projectTitle: document.getElementById('projectTitle'),
      projectSubtitle: document.getElementById('projectSubtitle'),
    };

    const FILE_WRITE_TOOLS = new Set([
      'create_file',
      'rewrite_file',
      'replace_in_file',
      'replace_lines_in_file',
      'inject_code_at_line',
      'append_to_file',
      'create_project_scaffold',
    ]);

    function displayPath(value) {
      if (!value) return 'file';
      return String(value).replace(/\\/g, '/');
    }

    function shouldShowAgentText(text) {
      const trimmed = String(text || '').trim();
      return trimmed.length > 0 && trimmed.length < 1400;
    }

    function setSessionId(sessionId) {
      if (!sessionId) return;
      state.sessionId = sessionId;
      CONFIG.sessionId = sessionId;
    }

    function setConnection(connected, mode = 'neutral') {
      state.connected = connected;
      els.connDot.className = 'dot' + (connected ? ' connected' : mode === 'error' ? ' error' : '');
      els.connText.textContent = connected ? 'Connected' : (mode === 'error' ? 'Error' : 'Disconnected');
      els.connectBtn.textContent = connected ? 'Reconnect' : 'Connect';
      updateGenerationControls();
    }

    function setGenerating(isGenerating) {
      state.generating = isGenerating;
      els.chatLoader.classList.toggle('visible', isGenerating);
      updateGenerationControls();
    }

    function updateGenerationControls() {
      els.sendBtn.disabled = !state.connected || state.generating;
      els.stopBtn.disabled = !state.connected || !state.generating;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function timeLabel() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function addMessage(role, content, meta = '') {
      state.messages.push({ role, content, meta, timestamp: Date.now() });
      renderMessages();
    }

    function renderMessages() {
      els.chatLog.innerHTML = state.messages.map((message) => {
        const roleLabel = message.role === 'user' ? 'You' : 'Agent';
        const roleClass = message.meta === 'file-op' ? 'file-op' : message.role;
        return `
          <article class="message ${roleClass}">
            <div class="message-meta">
              <span>${roleLabel}</span>
              <span>${escapeHtml(message.meta || timeLabel())}</span>
            </div>
            <div class="message-body">${escapeHtml(message.content)}</div>
          </article>
        `;
      }).join('');
      els.chatLog.scrollTop = els.chatLog.scrollHeight;
    }

    function renderFiles() {
      els.fileCount.textContent = String(state.files.length);
      if (!state.files.length) {
        els.fileList.innerHTML = '<li class="empty-state">No files generated yet.</li>';
        els.previewBox.textContent = 'No file selected.';
        els.previewLabel.textContent = 'Select a file';
        return;
      }

      els.fileList.innerHTML = state.files.map((file, index) => `
        <li class="file-item ${index === state.selectedFileIndex ? 'active' : ''}" data-index="${index}">
          <div class="file-path">${escapeHtml(file.path || file.name || `file-${index + 1}`)}</div>
          <div class="file-meta">${escapeHtml(file.type || (file.content ? 'text' : 'data'))}</div>
        </li>
      `).join('');

      if (state.selectedFileIndex < 0) {
        state.selectedFileIndex = 0;
      }
      showSelectedFile();
    }

    function showSelectedFile() {
      const file = state.files[state.selectedFileIndex];
      if (!file) return;
      els.previewBox.textContent = file.content || JSON.stringify(file, null, 2);
      els.previewLabel.textContent = file.path || file.name || 'Selected file';
      els.fileList.querySelectorAll('.file-item').forEach((item) => {
        item.classList.toggle('active', Number(item.dataset.index) === state.selectedFileIndex);
      });
    }

    function setRawOutput(output) {
      state.rawOutput = output;
    }

    function pushStructuredFiles(payload) {
      const incoming = Array.isArray(payload.files) ? payload.files : [];
      if (!incoming.length) return;
      state.files = incoming.map((file) => ({
        path: file.path || file.name || 'untitled',
        name: file.name || file.path || 'untitled',
        type: file.type || 'text',
        content: file.content || '',
      }));
      state.selectedFileIndex = 0;
      renderFiles();
    }

    function upsertGeneratedFile(filePayload) {
      const path = filePayload.path || filePayload.name;
      if (!path) return;
      const normalized = {
        path,
        name: filePayload.name || path,
        type: filePayload.type || 'text',
        content: filePayload.content || '',
      };
      const index = state.files.findIndex((file) => file.path === path);
      if (index >= 0) {
        state.files[index] = normalized;
      } else {
        state.files.push(normalized);
      }
      if (state.selectedFileIndex < 0) state.selectedFileIndex = 0;
      renderFiles();
    }

    function requestFileManifest() {
      if (!state.socket || state.socket.readyState !== WebSocket.OPEN) return;
      state.socket.send(JSON.stringify({
        type: 'list_files',
        session_id: state.sessionId,
      }));
    }

    function connect() {
      if (state.socket) {
        try { state.socket.close(); } catch (_) {}
      }

      const socket = new WebSocket(CONFIG.wsUrl);
      state.socket = socket;
      setConnection(false);

      socket.addEventListener('open', () => {
        setConnection(true);
        const intro = launchConfig.projectName
          ? `Connected — ${launchConfig.projectName}`
          : 'Connected. Ready for prompts.';
        addMessage('agent', intro, 'system');
        requestFileManifest();
        if (launchConfig.pendingAutostart && els.promptInput.value.trim()) {
          launchConfig.pendingAutostart = false;
          setTimeout(() => sendPrompt(), 400);
        }
      });

      socket.addEventListener('message', (event) => {
        let payload = null;
        try {
          payload = JSON.parse(event.data);
        } catch (_) {
          addMessage('agent', event.data, 'raw');
          return;
        }

        if (payload.session_id && payload.session_id !== state.sessionId) {
          setSessionId(payload.session_id);
        }

        if (payload.type === 'ack') {
          setGenerating(true);
          addMessage('agent', 'Agent started working…', 'system');
          return;
        }

        if (payload.type === 'stopping') {
          addMessage('agent', 'Stopping at next checkpoint…', 'stop');
          return;
        }

        if (payload.type === 'tool_start') {
          const tool = payload.tool || '';
          const args = payload.args || {};
          if (tool === 'create_file' || tool === 'rewrite_file') {
            addMessage('agent', `Creating ${displayPath(args.file_path)}`, 'file-op');
          } else if (tool === 'create_project_scaffold') {
            addMessage('agent', `Scaffolding ${displayPath(args.project_name)}`, 'file-op');
          } else if (FILE_WRITE_TOOLS.has(tool) && args.file_path) {
            addMessage('agent', `Creating ${displayPath(args.file_path)}`, 'file-op');
          }
          return;
        }

        if (payload.type === 'retry') {
          addMessage('agent', payload.message || 'Model busy, retrying…', 'system');
          return;
        }

        if (payload.type === 'tool_result' || payload.type === 'thinking' || payload.type === 'user_input') {
          return;
        }

        if (payload.type === 'assistant_message') {
          if (payload.final) {
            const text = payload.content || '';
            if (shouldShowAgentText(text)) {
              addMessage('agent', text, 'agent');
            } else if (text.trim()) {
              addMessage('agent', 'Run complete — see Project Files.', 'system');
            }
          }
          return;
        }

        if (payload.type === 'response') {
          const output = payload.output || '';
          setRawOutput(output);
          if (shouldShowAgentText(output)) {
            addMessage('agent', output, 'agent');
          } else if (output.trim()) {
            addMessage('agent', 'Run complete — see Project Files.', 'system');
          }
          const maybeJson = tryParseStructuredFiles(output);
          if (maybeJson) pushStructuredFiles(maybeJson);
          requestFileManifest();
          setGenerating(false);
          return;
        }

        if (payload.type === 'generated_file') {
          addMessage('agent', `Completed ${displayPath(payload.path)}`, 'file-op');
          upsertGeneratedFile(payload);
          return;
        }

        if (payload.type === 'generated_file_error') {
          addMessage('agent', `Failed ${displayPath(payload.path)}: ${payload.error || 'error'}`, 'error');
          return;
        }

        if (payload.type === 'files') {
          pushStructuredFiles(payload);
          return;
        }

        if (payload.type === 'stopped' || payload.type === 'run_complete') {
          setGenerating(false);
          addMessage('agent', payload.type === 'stopped' ? 'Generation stopped.' : 'Agent run finished.', 'system');
          return;
        }

        if (payload.type === 'reset') {
          state.files = [];
          state.selectedFileIndex = -1;
          state.messages = [];
          renderMessages();
          renderFiles();
          addMessage('agent', 'Session reset.', 'system');
          return;
        }

        if (payload.type === 'error') {
          setConnection(false, 'error');
          addMessage('agent', payload.error || 'Socket error.', 'error');
          setGenerating(false);
          return;
        }

        if (payload.agent_complete) {
          setGenerating(false);
          return;
        }

        if (payload.files) {
          pushStructuredFiles(payload);
        }
      });

      socket.addEventListener('close', () => {
        setConnection(false);
        setGenerating(false);
        addMessage('agent', 'Disconnected.', 'system');
      });

      socket.addEventListener('error', () => {
        setConnection(false, 'error');
        setGenerating(false);
      });
    }

    function tryParseStructuredFiles(text) {
      const trimmed = String(text || '').trim();
      if (!trimmed) return null;
      const fenced = trimmed.match(/```json\s*([\s\S]*?)```/i);
      const candidate = fenced ? fenced[1] : trimmed;
      try {
        const parsed = JSON.parse(candidate);
        if (parsed && (Array.isArray(parsed.files) || parsed.type === 'files')) {
          return parsed;
        }
      } catch (_) {}
      return null;
    }

    function sendPrompt() {
      const prompt = els.promptInput.value.trim();
      if (!prompt) return;
      if (!state.socket || state.socket.readyState !== WebSocket.OPEN) {
        connect();
        setTimeout(() => sendPrompt(), 250);
        return;
      }

      addMessage('user', prompt, 'you');
      const workingDirectory = launchConfig.workingDirectory || null;
      state.socket.send(JSON.stringify({
        type: 'message',
        prompt,
        session_id: state.sessionId,
        working_directory: workingDirectory || undefined,
      }));
      els.promptInput.value = '';
      setGenerating(true);
    }

    function stopGeneration() {
      if (!state.socket || state.socket.readyState !== WebSocket.OPEN) {
        setGenerating(false);
        return;
      }
      state.socket.send(JSON.stringify({
        type: 'stop',
        session_id: state.sessionId,
      }));
    }

    function clearChat() {
      state.messages = [];
      renderMessages();
    }

    function copyCurrentFile() {
      const file = state.files[state.selectedFileIndex];
      if (!file) return;
      navigator.clipboard.writeText(file.content || '').catch(() => {});
    }

    els.connectBtn.addEventListener('click', connect);
    els.clearBtn.addEventListener('click', clearChat);
    els.sendBtn.addEventListener('click', sendPrompt);
    els.stopBtn.addEventListener('click', stopGeneration);
    els.copyBtn.addEventListener('click', copyCurrentFile);
    els.refreshBtn.addEventListener('click', () => {
      renderFiles();
      requestFileManifest();
    });

    els.fileList.addEventListener('click', (event) => {
      const item = event.target.closest('.file-item');
      if (!item) return;
      state.selectedFileIndex = Number(item.dataset.index);
      showSelectedFile();
    });

    els.promptInput.addEventListener('keydown', (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
        event.preventDefault();
        sendPrompt();
      }
    });

    if (launchConfig.projectName) {
      els.projectTitle.textContent = launchConfig.projectName;
      els.projectSubtitle.textContent = 'Agent workspace';
    }

    renderMessages();
    renderFiles();
    setConnection(false);
    updateGenerationControls();

    (async () => {
      await loadSessionBootstrap();
      connect();
    })();
  </script>
</body>
</html>
